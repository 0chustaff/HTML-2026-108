    <style>
                * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-image: url('elliot.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }
        .tarja-site {
            background-color: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            width: 100%;
        }

    
        .marca a {
            color: #ff0000;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .navegacao ul {
            list-style: none;
            display: flex; 
            gap: 20px;     
            margin: 0;
            padding: 0;
        }

        .navegacao a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: bold;
            transition: color 0.2s;
        }

        .navegacao a:hover {
            color: #ff0000;
        }
    </style>
