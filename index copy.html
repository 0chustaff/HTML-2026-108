<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-image: url(elliot.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
    <header class="tarja-site">
        <div class="logo">
            <a href="index copy.html">MR. ROBOT</a>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Personagens</a></li>
                <li><a href="index.html">Site Original/Temporário</a></li>
            </ul>
        </nav>
    </header>
    <style>
                * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-image: url('elliot.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        .tarja-site {
        background-color: rgba(0, 0, 0, 0.4);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 40px;
        width: 100%;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
        }

    
        .marca a {
            color: #ff0000;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .navegacao ul {
        list-style: none;
        display: flex !important;
        gap: 25px;
        margin: 0;
        padding: 0;
        }

        .navegacao a,
        .navegacao a:visited,
        .navegacao a:link {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 0.9em;
            font-weight: bold;
            transition: color 0.2s;
        }

        .navegacao a:hover {
            color: #ff0000 !important;
        }
    </style>

</body>
