<title>Personagens - Mr. Robot</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background-color: #111111;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-image: url('https://i.pinimg.com/736x/08/8a/2f/088a2f5ae0dd443ecceff4071f238016.jpg');
        color: white;
        font-family: Arial, sans-serif;
    }


    /* CABEÇALHO */

    .tarja-site {
        background-color: rgba(0, 0, 0, 0.4);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 40px;
        width: 100%;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
    }


    /* LOGO */

    .logo-img {
        height: 30px;
        width: auto;
        display: block;
    }


    /* MENU */

    .navegacao ul {
        list-style: none;
        display: flex;
        gap: 25px;
    }

    .navegacao a {
        color: white;
        text-decoration: none;
        font-size: 0.9em;
        font-weight: bold;
    }

    .navegacao a:hover {
        color: red;
    }


    /* TÍTULO */

    h1 {
        text-align: center;
        margin-top: 60px;
        margin-bottom: 30px;
        color: white;
    }


    /* TABELA TRANSPARENTE */

    .tabela {
        width: 70%;
        margin: 0 auto;
        border-collapse: collapse;

        /* Tabela preta transparente */
        background-color: rgba(0, 0, 0, 0.55);

        color: white;
    }


    /* CABEÇALHO DA TABELA */

    .tabela th {
        background-color: rgba(153, 0, 0, 0.80);
        color: white;
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }


    /* CÉLULAS */

    .tabela td {
        padding: 15px;
        text-align: center;

        /* Transparência das células */
        background-color: rgba(0, 0, 0, 0.30);

        color: white;

        border: 1px solid rgba(255, 255, 255, 0.3);
    }


    /* EFEITO AO PASSAR O MOUSE */

    .tabela tr:hover {
        background-color: rgba(153, 0, 0, 0.40);
    }


    /* NOME DOS ATORES */

    .tabela .ator {
        color: red;
    }


    /* FOTOS */

    .tabela img {
        width: 100px;
        height: 120px;
        object-fit: cover;
    }

</style>
